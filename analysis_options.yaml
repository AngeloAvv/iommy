include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_single_quotes
    - cancel_subscriptions
    - close_sinks
    - prefer_final_in_for_each

analyzer:
  errors:
    todo: warning
    missing_return: error
    dead_code: error
    invalid_annotation_target: ignore
    prefer_single_quotes: warning
    # Flutter 3.50 deprecates package:flutter/material.dart (and the
    # Global*Localizations) in favour of material_ui/cupertino_ui. Migrating
    # is blocked by third-party packages (e.g. settings_ui) still using the
    # flutter/material types, so the deprecation is tolerated for now.
    deprecated_member_use: ignore
  exclude:
    - "**/*.barrel.dart"
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - build/**
    - linux/**
